# DXVK 3.1.1 settings for New Vegas Reloaded. No on-screen overlay.
# Copy d3d9.dll and dxvk.conf into the game folder (next to FalloutNV.exe), or into MO2's Root folder.
# To go back to the normal D3D9, delete both files.

dxvk.allowFse = True
d3d9.floatEmulation = Strict

# Report an AMD GPU instead of NVIDIA in every exe in this folder. DXVK's built-in profile only does this for
# FalloutNV.exe, so the launcher (FalloutNVLauncher.exe) saw the real card and could pick other settings.
d3d9.hideNvidiaGpu = True
d3d9.useD32forD24 = True
d3d9.seamlessCubes = True

# Overlay off (set to "fps" if you ever want a counter)
dxvk.hud =

# The game's own frame cap / NVTF handle pacing
d3d9.maxFrameRate = 0
